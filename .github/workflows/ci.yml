# =============================================================================
#  Intégration continue — Heritage
# =============================================================================
#
# Cinq portes bloquantes, plus la construction des images :
#
#   1. phpstan niveau 6, zéro erreur          (travail « api »)
#   2. phpunit, en parallèle (paratest)        (travail « api »)
#   3. vue-tsc --noEmit                        (travail « app »)
#   4. vitest, et 4 bis : ses sauts sont déclarés  (travail « app »)
#   5. npm run build                           (travail « app »)
#   6. docker compose build, les deux images   (travail « docker »)
#   7. la chaîne de déploiement se tient       (travail « deploiement »)
#
# Le travail « api » monte en plus un service **PostgreSQL 17**, et la porte 2 bis
# relit le rapport JUnit pour exiger que les tests qui en dépendent aient bien
# TOURNÉ. Sans elle, monter une base pour des tests qui continueraient de se sauter
# rendrait le même vert qu'avant, pour une machine de plus. La base est peuplée d'un
# arbre d'essai **inventé** (`api/tests/Gedcom/fixtures/arbre-essai.ged`) : le dépôt
# est public et l'ADR 0006 interdit toute personne réelle.
#
# LE TRAVAIL « APP » A LA MÊME GARDE DEPUIS LE 23 SEPTEMBRE 2026, et il lui a
# manqué trois jours de plus qu'à l'API. La porte 4 bis relit le rapport JSON de
# `vitest` et exige que les sauts soient **déclarés** — pas qu'ils soient nuls,
# ce qui serait une exigence qu'on ne peut pas satisfaire : les 23 cas du bloc
# « sur le graphe réel » demandent un relevé qui porte des personnes vivantes et
# ne peut pas entrer dans le dépôt. Ce qu'elle interdit, c'est le **24ᵉ**, et le
# budget périmé. Elle est née rouge, vue rouge quatre fois, puis mise au vert.
#
# LA PORTE 4 A MANQUÉ JUSQU'AU 20 SEPTEMBRE 2026, et son absence ne se voyait
# pas : le travail « app » s'appelait « vue-tsc + build », ce qu'il faisait
# exactement — mais « CI verte » était lu, en face, comme « les tests passent ».
# Les ~1200 tests du front n'avaient jamais tourné ailleurs que sur la machine
# de leur auteur, y compris ceux écrits exprès pour garder un correctif. Le vert
# était exact ; c'est le sens qu'on lui donnait qui débordait. L'asymétrie avec
# le travail « api », qui lance bien l'analyse ET les tests, ne se devinait
# depuis aucun écran.
#
# Regroupées en trois travaux et non cinq : chaque travail supplémentaire coûte
# un démarrage de machine et une réinstallation de dépendances, et les minutes
# d'un dépôt privé sont comptées. Les étapes restent nommées une par une, donc
# une porte qui tombe se lit directement dans la liste des vérifications de la
# demande de fusion.
#
# Le style de code (php-cs-fixer) n'est délibérément PAS une porte : c'est une
# question de mise en forme, pas de correction, et un échec de CI sur un espace
# manquant apprend à ignorer la CI. Il se lance à la main :
#   php vendor/bin/php-cs-fixer fix
#
# Épinglage des actions : à la version majeure, comme le dépôt de référence.
# Le cran au-dessus, si la chaîne d'approvisionnement devient une préoccupation,
# est d'épingler au SHA de commit — une étiquette peut être redéplacée, pas un SHA.
# =============================================================================

name: CI

on:
  # **UNE SEULE CI PAR CHANGEMENT : CELLE DE LA PULL REQUEST.**
  #
  # Il n'y a plus de `push` sur `main`. Une pull request teste déjà le commit de
  # fusion SIMULÉ (`refs/pull/N/merge`) : quand `main` n'a pas bougé depuis, la
  # fusion réelle produit exactement la même arborescence, octet pour octet, et
  # la rejouer ne prouvait rien de plus — elle faisait attendre un deuxième vert
  # avant chaque déploiement.
  #
  # Le lien entre les deux est l'EMPREINTE D'ARBORESCENCE (`git rev-parse
  # HEAD^{tree}`), publiée par le job `arbre` ci-dessous et vérifiée par la porte
  # de `deploy.yml` : on déploie un commit de `main` si une CI verte a testé la
  # même arborescence. Si `main` a bougé entre la CI et la fusion, l'empreinte
  # diffère, la porte refuse — et `workflow_dispatch` relance la CI sur `main`.
  pull_request:
  workflow_dispatch:

# Rien à écrire dans le dépôt : ni commentaire, ni étiquette, ni publication
# d'image. Le jeton n'a donc besoin que de la lecture.
permissions:
  contents: read

# Une poussée rapide sur une branche annule l'exécution précédente, qui ne
# concerne plus l'état courant. Économie directe de minutes sur dépôt privé.
#
# **SAUF SUR `main`, ET C'EST LA MOITIÉ QUI MANQUAIT.** La référence est dans le
# groupe, donc une branche n'annule jamais `main` — cette moitié-là était déjà juste,
# et elle a fait geler la branche quatre fois pour rien. Mais deux fusions
# rapprochées sur `main` tombent, elles, dans le MÊME groupe : la seconde annulait la
# première, et le commit fusionné entre les deux n'obtenait jamais de vert à lui.
#
# Mesuré le 23/09/2026 : la CI de `main` pour la #47 a été annulée au bout de 28 s
# par la fusion de la #46, vingt secondes plus tard. Rien ne l'a signalé — **une
# exécution annulée n'est pas un échec, elle disparaît de la liste.** C'est le mode
# « fusionné jamais servi » : on déploie plus tard un commit dont aucune porte n'a
# jamais rendu son verdict.
#
# La discipline humaine ne suffit pas : « sérialiser les fusions » a tenu jusqu'à ce
# que deux feux verts se croisent de vingt secondes. La réparation est structurelle,
# et `deploy.yml` la fait déjà avec `cancel-in-progress: false`.
#
# Sur `main`, les exécutions se mettent donc en FILE au lieu de s'annuler : chacune
# rend son verdict, la suivante attend son tour. Le comportement des branches n'est
# PAS touché — l'annulation y reste active, et c'est voulu, l'état qu'elle mesurait
# n'existe plus.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:

  api:
    name: API — phpstan + phpunit (+ PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api

    # PostgreSQL 17, la version de `compose.yaml`. Il ne remplace pas SQLite : la
    # quasi-totalité de la suite continue de tourner sans base externe, et c'est une
    # propriété qu'on garde. Il n'existe que pour les tests du groupe
    # `donnees-reelles`, qui comparent un moteur à l'autre et ne peuvent donc pas se
    # contenter d'un seul.
    #
    # Identifiants identiques à ceux de `compose.yaml` : c'est le DSN par défaut que
    # les tests utilisent quand `HERITAGE_DSN_REEL` n'est pas posée, et faire
    # coïncider les deux évite un réglage de plus à maintenir en double.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: heritage
          POSTGRES_PASSWORD: heritage_dev
          POSTGRES_DB: heritage
        ports:
          - 5432:5432
        # Sans `--health-cmd`, les étapes démarrent avant que le serveur accepte les
        # connexions, et l'ensemencement échoue une fois sur trois pour une raison
        # qui n'a rien à voir avec le code.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          # intl et gd sont exigées par composer.json (tri des noms accentués,
          # vignettes et purge EXIF). pdo_sqlite parce que api/.env.test bascule la
          # base de test sur SQLite : l'essentiel de la suite tourne sans base
          # externe, et doit continuer à le pouvoir. pdo_pgsql pour le service
          # ci-dessus — sans elle, les tests du groupe `donnees-reelles` se
          # **sautent**, ce qui est un vert qui ne mesure rien.
          extensions: intl, zip, gd, exif, pdo_sqlite, pdo_pgsql
          coverage: none

      - name: Cache des dépendances Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('api/composer.lock') }}
          restore-keys: composer-

      - name: Installer les dépendances
        run: composer install --no-interaction --prefer-dist --no-progress

      # ── L'ensemencement de la base PostgreSQL ────────────────────────────────
      #
      # **Des personnes inventées, jamais réelles.** `arbre-essai.ged` est versionné
      # et ne porte que des noms fabriqués (Persil, Thym, Bréval…). Le dépôt est
      # public et l'ADR 0006 interdit toute personne réelle : aucune donnée de
      # l'arbre du commanditaire n'entre ici, ni maintenant ni jamais.
      #
      # On passe par les migrations puis par la **vraie** commande d'import, et non
      # par un `INSERT` de circonstance : ce que les tests liront ensuite est ce que
      # l'import écrit réellement, pas ce qu'on aurait cru qu'il écrit.
      #
      # `--premier-import` parce que la commande refuse un arbre vide sous des
      # comptes existants ; ici il n'y a ni comptes ni arbre, et ce drapeau dit que
      # c'est légitime. `--attendus` parce que les totaux de contrôle sont indexés
      # par empreinte de fichier et que celui-ci n'a pas de jeu de référence : onze
      # individus, cinq familles, comptés dans le fichier lui-même.
      - name: Ensemencer PostgreSQL avec l'arbre d'essai (données inventées)
        env:
          DATABASE_URL: "postgresql://heritage:heritage_dev@127.0.0.1:5432/heritage?serverVersion=17&charset=utf8"
        run: |
          set -euo pipefail
          php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration
          php bin/console heritage:import-gedcom tests/Gedcom/fixtures/arbre-essai.ged \
            --premier-import --attendus personnes=11,familles=5

      # Porte 1. `--level=6` en ligne de commande et non seulement dans
      # phpstan.neon : la CI est le contrat, elle ne doit pas pouvoir être
      # assouplie en abaissant le niveau dans le fichier de configuration.
      - name: Porte 1 — analyse statique (phpstan, niveau 6, zéro erreur)
        run: php vendor/bin/phpstan analyse --level=6 --no-progress --memory-limit=1G

      # Porte 2.
      #
      # `HERITAGE_EXIGE_BASE_REELLE` retourne les sauts du groupe `donnees-reelles`
      # en échecs. C'est le cœur de la porte 2 bis : ici, un saut ne veut pas dire
      # « sans objet », il veut dire « le service n'est pas branché » — et c'est
      # précisément ce qu'on ne doit pas apprendre en vert.
      #
      # EN PARALLÈLE, un processus par cœur (paratest, 05/10/2026). La suite est la
      # porte la plus longue de la CI — 4 min 24 sur la #295, les trois quarts du
      # travail « api » — et son temps est réparti : 1923 cas d'environ 0,2 s, aucun
      # au-delà de 4 s. Rien à gagner test par test ; tout à gagner en les
      # répartissant. `tests/bootstrap.php` isolait déjà chaque processus (base
      # SQLite, pools de cache et conteneur au nom du PID) : la suite était prête.
      # Mesuré sur 4 cœurs, ceux d'un exécuteur de dépôt public : 5 min 40 → 2 min 02,
      # mêmes 1923 cas, mêmes sauts, et le même rapport JUnit pour la porte 2 bis
      # (paratest lit `phpunit.dist.xml`, `failOn*` et `<logging>` compris).
      # `vendor/bin/phpunit` reste la commande d'un poste de développement.
      - name: Porte 2 — tests (phpunit, en parallèle)
        env:
          HERITAGE_DSN_REEL: postgresql://heritage:heritage_dev@127.0.0.1:5432/heritage
          HERITAGE_EXIGE_BASE_REELLE: '1'
        run: php vendor/bin/paratest --processes="$(nproc)"

      # Porte 2 bis. **Le décompte est lu, pas supposé.**
      #
      # Une porte verte ne dit pas combien de cas elle a exécutés. Monter un service
      # PostgreSQL pour que les tests qui en dépendent continuent de se sauter
      # produirait exactement le même vert qu'avant — et coûterait une machine de
      # plus pour ne rien mesurer. On relit donc la sortie JUnit et on exige le
      # nombre de cas, zéro saut.
      #
      # `if: always()` : quand la porte 2 tombe, c'est là qu'on veut savoir si elle
      # est tombée parce qu'un test a échoué ou parce qu'aucun n'a tourné.
      - name: Porte 2 bis — les tests PostgreSQL ont TOURNÉ, et n'ont pas sauté
        if: always()
        run: php ../.github/scripts/verifier-les-tests-postgres.php

  app:
    name: Front — vue-tsc + vitest + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Installer les dépendances
        run: npm ci --no-audit --no-fund

      # Porte 3. `vue-tsc --noEmit` et non `tsc` : seul vue-tsc comprend les
      # blocs `<script setup lang="ts">` des composants.
      - name: Porte 3 — vérification des types (vue-tsc --noEmit)
        run: npm run typecheck

      # Porte 4. **La porte qui manquait.** Elle est placée avant le build, et
      # non après, pour deux raisons : elle échoue sur ce qu'on veut savoir en
      # premier, et elle met le travail « app » dans le même ordre que le
      # travail « api » — l'analyse statique, puis les tests.
      #
      # `npm test` est `vitest run` (et non `vitest`, qui resterait en
      # surveillance et ferait expirer le travail au bout de 15 minutes).
      #
      # `npm run test:rapport` ajoute le rapport JSON que lit la porte 4 bis. Le
      # rapporteur `default` est gardé à côté : sans lui, la sortie du travail
      # deviendrait illisible pour un humain.
      - name: Porte 4 — tests unitaires (vitest)
        run: npm run test:rapport

      # Porte 4 bis. **Le pendant front de la porte 2 bis, et il manquait.**
      #
      # Une porte 4 verte ne dit pas combien de cas elle a exécutés. 23 d'entre
      # eux sont derrière `describe.runIf(HERITAGE_GRAPHE_CLIENT !== undefined)`,
      # que ce fichier ne posait nulle part : ils ne tombaient pas, ils
      # disparaissaient du décompte. En les faisant tourner à la main, un cas est
      # rouge sur `main` depuis un moment — et une branche candidate à la fusion
      # en ajoutait un second tout en rendant les cinq portes vertes.
      #
      # `if: always()` : quand la porte 4 tombe, c'est là qu'on veut savoir si
      # elle est tombée parce qu'un cas a échoué ou parce qu'aucun n'a tourné.
      - name: Porte 4 bis — les cas front ont TOURNÉ, et les sauts sont déclarés
        if: always()
        run: node ../.github/scripts/verifier-les-tests-front.mjs

      # Porte 5. Le typage peut passer alors que le build casse (import d'un
      # actif absent, plugin Vite mal configuré) : ce sont deux portes, pas une.
      - name: Porte 5 — build de production (vite build)
        run: npm run build

  docker:
    name: Docker — compose + build des deux images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # EN MÊME TEMPS que les autres travaux, sans `needs:` (05/10/2026). Il attendait
    # « api » et « app », pour ne pas reconstruire deux images pour du code qui ne
    # compile pas. Mais le dépôt est public — les minutes ne coûtent rien — et la
    # porte de `deploy.yml` exige de toute façon la CI ENTIÈRE au vert. L'attente
    # ne protégeait rien et coûtait ses deux minutes à chaque CI : mesuré sur la
    # #295, 8 min 05 de bout en bout, dont 2 min 10 de Docker posées APRÈS les
    # 5 min 47 de l'API, alors qu'elles pouvaient courir pendant.
    steps:
      - uses: actions/checkout@v4

      # Les deux fichiers doivent se rendre sans substitution manquante. Sans
      # `.env` sur le runner : c'est aussi la vérification que tous les replis de
      # développement sont bien en place dans compose.yaml.
      - name: Validation des fichiers Compose (développement et production)
        run: |
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.prod.yaml config --quiet

      # Porte 6. La seule vérification qui exerce réellement les deux
      # Dockerfile : installation des extensions PHP et de Composer d'un côté,
      # `npm ci` puis `vite build` puis copie dans nginx de l'autre.
      - name: Porte 6 — construction des deux images
        run: docker compose build

      # Porte 6 bis. L’image CONSTRUITE applique-t-elle les limites du dépôt ?
      #
      # Ni la porte 6 ni l'empreinte ne peuvent répondre à ça. La porte 6 prouve
      # que le Dockerfile se construit, pas qu'il configure quoi que ce soit ; et
      # `docker/empreinte.sh`, qui hache bien `docker/php.ini` depuis le
      # 17 septembre 2026, atteste que ces octets sont PARTIS dans l'image — pas
      # que PHP les a LUS. Chemin de copie, ordre de balayage de `conf.d`,
      # directive écrasée plus loin : l'empreinte concorde, les limites non.
      #
      # L'image de base n'active aucun php.ini : sans ce contrôle, l'API repart
      # en silence sur les défauts compilés de PHP — memory_limit 128M,
      # upload_max_filesize 2M, post_max_size 8M — état dans lequel quatre dépôts
      # de preuves sur dix échouaient en 500. Le seul témoin recevable est PHP
      # lui-même, interrogé DANS le conteneur.
      #
      # `--no-deps` : ni base ni boîte aux lettres, on ne démarre rien.
      # `--entrypoint php` : l'entrypoint de l'image attend PostgreSQL et joue les
      # migrations ; on veut PHP, pas la pile.
      - name: Porte 6 bis — le conteneur applique-t-il les limites PHP du dépôt ?
        run: |
          bash .github/scripts/verifier-les-limites-php.sh \
            docker compose run --rm --no-deps --entrypoint php api -i

  # ---------------------------------------------------------------------------
  # Porte 7 — la chaîne de déploiement se tient
  # ---------------------------------------------------------------------------
  #
  # POURQUOI CETTE PORTE EXISTE. Le flux de déploiement ne part que si CETTE CI
  # est verte. Tout ce qui est vérifié ici est donc vérifié AVANT toute mise en
  # production — et, plus important, ne peut plus être défait en silence par un
  # autre chantier. Chaque contrôle correspond à une panne muette déjà identifiée,
  # dont la réparation tient à une ligne qu'un « nettoyage » bien intentionné
  # supprimerait sans y penser.
  #
  # Aucune dépendance, aucun `needs:` : ce sont des greps et un shellcheck, une
  # trentaine de secondes, et rien ne sert à les faire attendre.
  deploiement:
    name: Déploiement — script, gabarit et garde-fous
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # Le script tourne sur le VPS, sous `set -euo pipefail`, et manipule un
      # `git reset --hard`. Une faute de quotation y est bien plus coûteuse
      # qu'ailleurs. shellcheck est préinstallé sur le runner.
      - name: Le script de déploiement est syntaxiquement sain
        run: |
          set -euo pipefail
          for script in .github/scripts/*.sh; do
            echo "── $script"
            bash -n "$script"
            shellcheck "$script"
          done

      # certbot relit le vhost pour y écrire la moitié TLS et le REJETTE s'il
      # n'est pas décodable. Un seul commentaire accentué suffit à faire échouer
      # l'émission du certificat — et l'échec se produit sur le serveur, trois
      # semaines plus tard, chez quelqu'un qui n'a pas écrit la ligne.
      - name: Le vhost de l'hôte est en ASCII pur
        run: |
          set -euo pipefail
          fichier=docs/deploiement/heritage.naltpom.fr.conf
          if LC_ALL=C grep -n '[^ -~\t]' "$fichier"; then
            echo "::error file=$fichier::Octets non-ASCII ci-dessus. certbot refusera ce fichier."
            exit 1
          fi
          echo "$fichier : ASCII pur."

      # Le gabarit. Si ce jeton disparaît, le `server_name` ne nomme plus que
      # localhost : le premier bloc du fichier est un `return 444`, et TOUTE
      # requête portant le domaine réel se fait fermer la connexion au nez, sans
      # un octet de réponse et sans une ligne de journal. C'est la panne la plus
      # silencieuse de tout le projet, et elle tient à ces vingt-cinq caractères.
      - name: app/nginx.conf nomme toujours le domaine par variable
        run: |
          set -euo pipefail
          if ! grep -qE '^\s*server_name .*\$\{HERITAGE_DOMAINE_PUBLIC\};' app/nginx.conf; then
            echo "::error file=app/nginx.conf::La ligne server_name du bloc applicatif ne porte plus \${HERITAGE_DOMAINE_PUBLIC}."
            echo "Sans elle, le front ferme en 444 toute requête portant le domaine réel."
            exit 1
          fi
          if ! grep -q 'location = /sante.php' app/nginx.conf; then
            echo "::error file=app/nginx.conf::La sonde /sante.php n'est plus relayée : le déploiement ne peut plus vérifier ce qu'il déploie."
            exit 1
          fi
          echo "Gabarit et sonde en place."

      # La SECONDE sonde, et le même argument que celle du dessus.
      #
      # `sante.php` rend l'empreinte de l'image de l'API : elle ne bouge pas d'un
      # caractère quand seul `app/` change. La porte du paquet de `deploy.yml`
      # est l'autre moitié — elle répond à « le front servi est-il celui qu'on
      # vient de construire ? » — et elle repose sur trois choses qui vivent
      # toutes dans `app/`, donc hors du flux de déploiement : `empreinte.sh`,
      # une ligne du `Dockerfile`, et la `map` de cache de `nginx.conf`.
      #
      # Les trois peuvent disparaître par un remaniement raisonnable. La
      # troisième est la pire : un `/paquet.txt` mis en cache un an ferait
      # **mentir** la porte — elle comparerait une valeur figée à elle-même et
      # rendrait vert sur le cas qu'elle existe pour attraper. Le détail du
      # raisonnement, et pourquoi la garde ÉVALUE la map au lieu de la lire, sont
      # dans l'en-tête du script.
      # Ce travail n'a pas de `working-directory` : il tourne à la racine du
      # dépôt, contrairement à « api » et « app ».
      - name: Les trois appuis de la porte du paquet tiennent
        run: bash .github/scripts/verifier-la-sonde-du-paquet.sh

      # Les quatre variables qui portent le domaine, et les deux qui portent les
      # invitations. Chacune a un repli MUET quelque part (api/.env copié dans
      # l'image, paramètre de service, liste blanche de développement) : absente
      # de l'orchestration, la pile démarre en annonçant « configuration
      # vérifiée » et se trompe en silence. Le `garde-secrets` est ce qui rend ces
      # absences bruyantes ; cette porte est ce qui empêche de le vider.
      - name: compose.prod.yaml injecte et vérifie les variables muettes
        run: |
          set -euo pipefail
          manquantes=""
          for cle in HERITAGE_URL_PUBLIQUE MAILER_EXPEDITEUR HERITAGE_DOMAINE_PUBLIC HERITAGE_HOTES_AUTORISES; do
            # Deux occurrences au moins : une dans le `garde-secrets` qui la
            # contrôle, une dans le service qui la consomme. Une seule signifie
            # qu'on contrôle une variable que personne ne reçoit — le défaut
            # exact déjà payé sur HERITAGE_HOTES_AUTORISES.
            n="$(grep -c "^      $cle:" compose.prod.yaml || true)"
            echo "$cle : $n déclaration(s) dans compose.prod.yaml"
            [ "$n" -ge 2 ] || manquantes="$manquantes $cle"
          done
          if [ -n "$manquantes" ]; then
            echo "::error file=compose.prod.yaml::Déclarées moins de deux fois :$manquantes"
            echo "Chacune doit être à la fois contrôlée par garde-secrets et injectée dans le service qui la lit."
            exit 1
          fi
          # Le modèle doit documenter ce que la production exige, sinon le
          # `.env` du serveur s'écrit de mémoire.
          for cle in HERITAGE_URL_PUBLIQUE MAILER_EXPEDITEUR HERITAGE_DOMAINE_PUBLIC HERITAGE_HOTES_AUTORISES; do
            grep -q "^$cle=" .env.example || {
              echo "::error file=.env.example::$cle absente du modèle."
              exit 1
            }
          done
          echo "Modèle .env.example complet."

      - name: Les deux fichiers Compose se rendent avec le gabarit monté
        run: |
          set -euo pipefail
          docker compose -f compose.yaml -f compose.prod.yaml config --quiet
          echo "compose.yaml + compose.prod.yaml : rendu sans substitution manquante."

  # ---------------------------------------------------------------------------
  # L'empreinte de ce qui a été testé
  # ---------------------------------------------------------------------------
  # Sur une pull request, `actions/checkout` extrait le commit de fusion simulé :
  # son arborescence est celle que `main` aura après la fusion, si `main` n'a pas
  # bougé. Elle est publiée comme nom d'artefact ; la porte de `deploy.yml` la
  # cherche, puis n'accepte que si l'exécution qui la porte est VERTE en entier.
  arbre:
    name: Empreinte de l'arborescence testée
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Calculer l'empreinte
        run: |
          set -euo pipefail
          arbre="$(git rev-parse 'HEAD^{tree}')"
          echo "$arbre" > arbre.txt
          echo "ARBRE=$arbre" >> "$GITHUB_ENV"
          echo "Arborescence testée : $arbre (commit $(git rev-parse HEAD))"
      - uses: actions/upload-artifact@v4
        with:
          name: arbre-${{ env.ARBRE }}
          path: arbre.txt
          retention-days: 90
