# Heritage -- vhost du nginx SYSTEME du VPS.
#
# Destination : /etc/nginx/sites-available/heritage.naltpom.fr
#               + symlink dans /etc/nginx/sites-enabled/
#
# POURQUOI PAS D'ACCENTS DANS CE FICHIER : certbot le relit pour y ecrire la
# moitie TLS et le rejette s'il n'est pas decodable ; un seul commentaire accentue
# suffit a faire echouer l'emission du certificat. Tout le fichier reste donc en
# ASCII pur, francais sans accents compris. C'est la seule exception a la
# convention du depot (commentaires en francais accentue). Le controle avant
# copie :
#     LC_ALL=C grep -n '[^ -~\t]' docs/deploiement/heritage.naltpom.fr.conf
#     -> doit ne rien rendre (code 1)
#
# CE FICHIER NE CONTIENT QUE LA MOITIE HTTP. La moitie TLS (listen 443,
# ssl_certificate, redirection 80 -> 443) est ECRITE PAR certbot :
#
#     sudo certbot --nginx -d heritage.naltpom.fr --redirect
#
# qui MODIFIE ce bloc `server` en place. Ne jamais recopier ce fichier par-dessus
# une version deja passee par certbot sans relancer certbot ensuite : la copie
# installee porte des marqueurs "managed by Certbot" qui disent qu'elle a ete
# completee.
#
# UN SEUL AMONT, ET C'EST LA DIFFERENCE AVEC LES VOISINS. certivio, sitter,
# pokemon et learnly publient une PAIRE de ports (api + front) et declarent deux
# `upstream`. Heritage n'en publie qu'un : son conteneur `app` porte deja un nginx
# qui relaie `/api` vers l'API par le reseau interne de la pile
# (voir app/nginx.conf). Le front et l'API partagent ainsi une ORIGINE UNIQUE,
# dont depend toute la politique de securite du projet -- pas de CORS, cookie de
# session HttpOnly + SameSite=Lax sans exception. Router `/api/` ici, vers un
# second port, casserait cette propriete pour rien.
#
#   127.0.0.1:5511 -> conteneur `app` (nginx : la SPA + le relais /api)
#
# 5511 est le port attribue a heritage par la convention du serveur : une paire
# par application, sur la boucle locale, dans l'ordre -- certivio 5471/5472,
# sitter 5481/5482, pokemon 5491/5492, learnly 5501/5502, heritage 5511/5512.
# Heritage n'utilise que le premier des deux. Il doit correspondre a `APP_PORT`
# du fichier .env de ~/apps/heritage : compose.prod.yaml publie
# "127.0.0.1:${APP_PORT}:80" et rien d'autre.
#
# LE DEFAUT 8080 NE MARCHE PAS ICI : il est deja pris sur ce serveur par le
# pgadmin d'un autre projet, publie sur 0.0.0.0:8080. Un .env qui garde 8080
# fait echouer le `up` au bind, avec un message que rien ne rattache a ce fichier.

# Websocket / SSE : valeur de l'en-tete Connection a passer en amont.
# Le nom est prefixe `heritage_` A DESSEIN : les vhosts voisins (certivio, sitter,
# pokemon, learnly) vivent dans le meme `http {}`, et deux `map` qui declarent la
# meme variable font echouer `nginx -t` avec "duplicate variable" -- ce qui
# couperait TOUS les sites du serveur, pas seulement celui-ci.
# La branche vide rend une chaine vide : nginx supprime alors l'en-tete
# Connection, ce qui laisse le keepalive vers l'amont fonctionner.
map $http_upgrade $heritage_connection_upgrade {
    default upgrade;
    ""      "";
}

upstream heritage_app {
    server 127.0.0.1:5511;
    # Un pool de connexions persistantes : sans lui, chaque requete ouvre et
    # ferme un socket. Exige HTTP/1.1 et un en-tete Connection vide cote
    # location (voir plus bas).
    keepalive 32;
}

server {
    # IPv4 seulement : le DNS generique *.naltpom.fr pointe un A vers ce VPS, et
    # un `listen [::]:80` ferait echouer `nginx -t` sur une machine sans IPv6.
    listen 80;
    server_name heritage.naltpom.fr;

    # 25 Mo, et la valeur n'est pas prise au hasard : les preuves sont des photos
    # d'actes prises au telephone. Le defaut de nginx est 1 Mo, qui fait echouer
    # le televersement avec un 413 que personne ne sait interpreter. Le nginx du
    # conteneur est regle sur la meme valeur (app/nginx.conf, location /api) ;
    # la borne reelle reste celle appliquee par l'API, qui seule peut refuser
    # proprement et expliquer pourquoi.
    client_max_body_size 25m;

    # ------------------------------------------------------------------
    # UN SEUL EN-TETE DE SECURITE EST POSE ICI, ET C'EST VOULU.
    #
    # Les vhosts voisins en posent cinq (X-Frame-Options, X-Content-Type-Options,
    # Referrer-Policy, Permissions-Policy, HSTS). Ici ce serait une FAUTE : la
    # pile heritage pose deja les siens, et a deux endroits -- le nginx du
    # conteneur pour la coque SPA et les actifs, l'API pour ses reponses JSON
    # (SecurityHeadersSubscriber). Les reposer ici les mettrait en DOUBLE, et
    # l'en-tete en double n'est pas inoffensif :
    #   - Referrer-Policy est une liste de jetons dont le DERNIER valide gagne :
    #     le notre, ajoute apres, ecraserait le `no-referrer` de l'API ;
    #   - Permissions-Policy est un dictionnaire ou une cle repetee ecrase la
    #     precedente : une valeur plus courte ici ROUVRIRAIT ce que l'API ferme.
    # Le defaut a deja ete paye une fois dans ce projet, entre le nginx du
    # conteneur et l'API. On ne le rejoue pas un etage plus haut.
    #
    # HSTS fait exception parce qu'il n'appartient a personne d'autre : il n'a de
    # sens qu'en HTTPS, et le HTTPS se termine ICI. Le conteneur, qui n'ecoute
    # qu'en clair, ne peut pas le poser correctement.
    #
    # Il est pose dans la moitie HTTP : certbot deplace ce bloc en TLS, l'en-tete
    # y suit, et c'est la qu'il atterrit. En clair il est simplement ignore par
    # les navigateurs.
    #
    # `includeSubDomains` sans `preload` : deux ans sur ce sous-domaine, mais
    # aucune inscription dans la liste de prechargement des navigateurs -- celle-ci
    # est difficile a defaire et engagerait naltpom.fr tout entier.
    # ------------------------------------------------------------------
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # PAS DE `gzip on` ICI. Le nginx du conteneur compresse deja (app/nginx.conf),
    # et il recoit l'en-tete Accept-Encoding du client tel quel puisqu'on le
    # relaie. Un seul compresseur dans la chaine : c'est plus simple a raisonner,
    # et une reponse deja compressee ne se recompresse pas.

    # ------------------------------------------------------------------
    # Tout passe par le conteneur `app`, y compris /api et /sante.php.
    #
    # Pas de `location /api` separe : le nginx du conteneur le relaie lui-meme
    # vers l'API. Pas de `location = /sante.php` separe non plus : le conteneur
    # l'expose deja, et c'est par ce chemin que le flux de deploiement verifie,
    # depuis l'exterieur, que le domaine sert bien l'empreinte du commit deploye.
    # Un bloc de plus ici n'ajouterait rien qu'une occasion de diverger.
    # ------------------------------------------------------------------
    location / {
        proxy_pass http://heritage_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $heritage_connection_upgrade;

        # `$http_host` et NON `$host` : les deux se ressemblent, mais `$host`
        # retire le port. L'API construit des liens a partir de cet en-tete, et
        # le nginx du conteneur le retransmet tel quel.
        proxy_set_header Host $http_host;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # ECRASER, ET NON COMPLETER. C'est le point 3 de la liste de
        # compose.prod.yaml, et c'est le troisieme garde-fou contre le `Host`
        # falsifie. `proxy_set_header` remplace la valeur : ce que le client a
        # envoye dans X-Forwarded-Proto ou X-Forwarded-Port est jete ici, et ne
        # peut donc plus influencer les liens que l'API fabrique.
        #
        # Sans X-Forwarded-Proto: https, Symfony se croit en clair :
        # `cookie_secure: auto` n'active pas le drapeau Secure sur le cookie de
        # session, et les URL absolues sortent en http.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 10s;
        # 120 s en ecriture : un televersement de 25 Mo depuis une connexion
        # mobile prend son temps, et le couper a 30 s rendrait un 504 au moment
        # ou l'utilisateur a presque fini.
        proxy_send_timeout 120s;
        proxy_read_timeout 60s;
    }
}
