; =============================================================================
;  Heritage — les limites PHP de l'image de l'API
; =============================================================================
;
; POURQUOI CE FICHIER EXISTE
;
; L'image `dunglas/frankenphp` n'embarque AUCUN php.ini actif. Elle livre
; `php.ini-development` et `php.ini-production` dans `/usr/local/etc/php/` et
; n'en active NI L'UN NI L'AUTRE. Relevé dans le conteneur en service, le
; 16 septembre 2026 :
;
;     Loaded Configuration File => (none)
;     memory_limit              => 128M   défaut compilé
;     upload_max_filesize       =>   2M   défaut compilé
;     post_max_size             =>   8M   défaut compilé
;
; Toutes les limites de l'API étaient donc les valeurs compilées de PHP — que
; personne n'a choisies, qu'aucun fichier du dépôt n'annonçait, et qui ne se
; voyaient qu'en interrogeant `php -i` DANS le conteneur. C'est la forme la plus
; désagréable d'une configuration : celle qui existe, qui décide, et qu'on ne
; peut pas lire.
;
; CE QUE ÇA A COÛTÉ
;
; Quatre dépôts de preuves sur dix ont échoué en 500. Deux causes distinctes se
; superposaient, et il faut les nommer séparément parce qu'elles ne se corrigent
; pas par la même ligne :
;
;   1. `upload_max_filesize = 2M` et `post_max_size = 8M`. Un acte numérisé
;      dépasse 2 Mio sans effort. PHP écarte alors le fichier AVANT que Symfony
;      voie quoi que ce soit (`UPLOAD_ERR_INI_SIZE`), et au-delà de
;      `post_max_size` il vide `$_POST` en entier : le contrôleur reçoit une
;      requête sans fichier ET sans champ, ce qui ne ressemble à aucune erreur
;      d'utilisateur.
;   2. `memory_limit = 128M`. Une page de 15,9 Mpx demande ~121 Mio rien que
;      pour ses deux tampons GD (voir plus bas) ; le noyau Symfony en occupe
;      déjà 6 Mio au démarrage, mesurés. Le dépassement se joue au mégaoctet
;      près — d'où des échecs qui paraissaient aléatoires alors qu'ils étaient
;      parfaitement déterministes.
;
; CE FICHIER EST LU PARCE QUE PHP BALAIE SON RÉPERTOIRE ADDITIONNEL
;
;     Scan this dir for additional .ini files => /usr/local/etc/php/conf.d
;
; Le Dockerfile l'y dépose sous `zz-heritage.ini`. Le `zz` n'est pas
; décoratif : le répertoire est balayé dans l'ordre alphabétique et les fichiers
; `docker-php-ext-*.ini` y sont déjà. Le nôtre passe en dernier, donc il gagne.
;
; ATTENTION — CE FICHIER N'ENTRE PAS DANS L'EMPREINTE DE L'IMAGE
;
; `docker/empreinte.sh` ne hache que `composer.lock` et les `*.php` / `*.yaml`
; de `src`, `config` et `public`. Modifier ce `.ini` ne change donc PAS
; l'empreinte servie par `/sante.php` : une image reconstruite avec un autre
; php.ini est indiscernable de l'ancienne par ce contrôle-là. C'est pour cette
; raison précise que la vérification de ces trois valeurs se fait en interrogeant
; `php -i` DANS le conteneur — voir `.github/scripts/verifier-les-limites-php.sh`,
; et jamais en constatant la présence de ce fichier dans le dépôt.
; =============================================================================

; -----------------------------------------------------------------------------
; memory_limit
; -----------------------------------------------------------------------------
;
; LE CALCUL, ET IL EST LIÉ À `PurgeDesMetadonnees::PIXELS_MAX`
;
; `purgerImage()` tient DEUX images GD vivantes en même temps : la source
; décodée (`imagecreatefromjpeg`) et la toile neuve (`imagecreatetruecolor`),
; toutes deux en couleurs vraies. GD alloue 4 octets par pixel pour chacune,
; donc 8 octets par pixel au pic.
;
; Mesuré sur PHP 8.4 + GD, en isolant la séquence exacte de `purgerImage()` :
;
;     1 000 000 px →  8 388 608 octets → 8,39 o/px
;     2 000 000 px → 16 777 216 octets → 8,39 o/px
;     4 000 000 px → 31 457 280 octets → 7,86 o/px
;     6 000 000 px → 48 234 496 octets → 8,04 o/px
;
; (Les écarts autour de 8,00 sont l'arrondi de `memory_get_usage(true)` à la
; taille de bloc de l'allocateur ; la valeur théorique 4 + 4 est confirmée.)
;
; 512 Mio se répartissent donc ainsi, et cette répartition est la règle que le
; seuil en pixels doit respecter :
;
;     512 Mio  memory_limit
;   − 256 Mio  réservés à TOUT CE QUI N'EST PAS L'IMAGE — noyau Symfony
;              (6 Mio mesurés au seul démarrage), Doctrine et l'unité de
;              travail, l'écriture du journal d'audit, le tampon d'encodage
;              de sortie, et la marge qui fait qu'un garde-fou garde
;   = 256 Mio  budget réel de l'image
;   ÷ 8 o/px   = 33 554 432 pixels
;
; D'où `PIXELS_MAX = 32 000 000` — arrondi EN DESSOUS de ce que le budget
; autorise, jamais au-dessus. `api/tests/Media/PlafondDePixelsTest.php`
; assertionne cette égalité entre ce fichier et la constante : changer l'un sans
; l'autre fait rougir la CI, ce qui est exactement le but.
;
; Pourquoi 512M et pas plus : le VPS n'a pas de swap. Une limite trop haute ne
; protège plus de rien — elle laisse le noyau Linux tuer le processus, et un
; `OOM killer` ne rend pas de 422, il rend un 502 sans explication.
memory_limit = 512M

; -----------------------------------------------------------------------------
; upload_max_filesize / post_max_size
; -----------------------------------------------------------------------------
;
; Alignés sur ce que nginx annonce DÉJÀ côté hôte et côté conteneur `app` :
;
;     client_max_body_size 25m;
;
; Les trois nombres doivent se lire ensemble, et dans cet ordre :
;
;     upload_max_filesize  20M   le fichier lui-même
;     post_max_size        25M   le fichier + les champs + l'enrobage multipart
;     client_max_body_size 25m   ce que nginx accepte de relayer
;
; `post_max_size` DOIT rester supérieur à `upload_max_filesize`, sans quoi un
; fichier à la limite haute est refusé par le second garde-fou après avoir passé
; le premier — et la réponse ne dit pas lequel a parlé.
;
; Les faire correspondre à nginx n'est pas une coquetterie : quand les deux
; diffèrent, le refus vient du plus bas des deux, et le message renvoyé à
; l'utilisateur dépend alors de QUI a refusé — un 413 nginx en HTML brut, ou un
; 422 de l'application. Deux refus pour la même cause, deux écrans différents.
upload_max_filesize = 20M
post_max_size = 25M
