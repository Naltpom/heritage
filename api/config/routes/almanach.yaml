# Contrat : ce fichier est celui du module Almanach (carte des lieux, anniversaires).
# Aucun autre module n'y écrit — c'est la règle qui évite les conflits de fusion.
#
# Les routes se déclarent par attributs #[Route] dans les contrôleurs du module ;
# l'import ci-dessous suffit à les charger. On n'ajoute ici que ce qu'un attribut
# ne sait pas exprimer : préfixe global, route servie par un service, redirection.

almanach_controleurs:
    resource:
        path: ../../src/Module/Almanach/Controller/
        namespace: App\Module\Almanach\Controller
    type: attribute
