# Sécurité — § 1.6 et § 2 du contrat d'API, § 2 et § 8 du dossier de mission.
#
# L'application contient des données de personnes vivantes qui n'ont pas demandé à y
# figurer. Trois principes gouvernent ce fichier, et aucun n'est négociable :
#
#   1. Tout est fermé par défaut. La dernière règle d'`access_control` couvre `^/api`
#      entier ; une route nouvelle est protégée avant d'être écrite.
#   2. Aucune redirection HTML. Une API rend du JSON, y compris pour dire « non ».
#   3. Aucune inscription ouverte. Il n'existe pas de route publique de création de
#      compte : on n'entre que par un lien d'invitation, et `^/api/inscription` répond
#      `404` sans jeton valide plutôt que `403` (§ 6.1 du dossier).
security:
    password_hashers:
        # `auto` = le meilleur standard courant du composant Security (aujourd'hui
        # Argon2id, demain son successeur) et la migration transparente des empreintes
        # existantes. Ne jamais figer un algorithme ici : ce serait s'engager à le
        # maintenir soi-même.
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # Deux rôles, et rien de plus (§ 1.6 du contrat). `ROLE_MEMBER` n'existe pas : la
    # distinction « membre actif » / « compte en attente » est un **régime**, porté par
    # `core_user.status` et lu par `Core\Security\RegimeVoter`. Un rôle qu'on retire à
    # l'activation serait une seconde source de vérité à côté du statut, et les deux
    # finiraient par diverger.
    role_hierarchy:
        ROLE_ADMIN: [ROLE_USER]

    providers:
        entity_utilisateurs:
            entity:
                class: App\Module\Core\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        # Le JETON D'API (ADR 0021, § 1.6 du contrat) : `Authorization: Bearer hrt_…`, hors
        # navigateur. Avant `main`, parce que le premier pare-feu qui correspond prend toute
        # la requête : `Core\Security\RequeteParJetonDApi` ne lui donne que les requêtes
        # `/api` qui portent un en-tête au schéma `Bearer` (pas un `Basic` posé par un
        # intermédiaire, pas une requête à cookie). Une requête qui porte les deux est jugée
        # sur son Bearer seul, sans session (`Core\EventSubscriber\JetonSansSessionSubscriber`).
        #
        # Sans état : rien n'est gardé d'une requête à l'autre, chaque appel présente son
        # jeton. Pas `lazy` : un jeton présenté est toujours jugé, y compris sur une route
        # publique — un jeton faux n'y passe pas pour anonyme.
        #
        # Le même fournisseur, le même `user_checker` (un compte suspendu n'obtient pas plus
        # de jeton que de session) et le même point d'entrée que `main` ; `access_control`
        # plus bas vaut pour les deux pare-feu. Ni `json_login`, ni `logout`, ni
        # `switch_user` : un jeton ne se connecte pas, ne se déconnecte pas, n'incarne pas.
        api_jetons:
            request_matcher: App\Module\Core\Security\RequeteParJetonDApi
            stateless: true
            provider: entity_utilisateurs
            user_checker: App\Module\Core\Security\UserChecker
            entry_point: App\Module\Core\Security\JsonAuthenticationEntryPoint
            access_token:
                # Mal formé, inconnu, expiré, révoqué : un seul refus (voir la classe).
                token_handler: App\Module\Core\Security\JetonDApiHandler
                # L'en-tête `Authorization: Bearer`, et lui seul : ni paramètre d'URL (il
                # finirait dans les journaux d'accès), ni corps de formulaire.
                token_extractors: header
                # Le `401` du point d'entrée, au caractère près — compte suspendu compris.
                failure_handler: App\Module\Core\Security\RefusDuJetonDApi

        main:
            lazy: true
            provider: entity_utilisateurs
            # Refuse la connexion d'un compte suspendu — après vérification du mot de
            # passe, pour ne pas faire de la route un oracle (voir la classe).
            user_checker: App\Module\Core\Security\UserChecker
            # Sans point d'entrée explicite, Symfony redirige vers un formulaire et le
            # front reçoit du HTML là où il attend `{"erreur": {...}}`.
            entry_point: App\Module\Core\Security\JsonAuthenticationEntryPoint

            json_login:
                check_path: core_connexion
                # Les clés du corps sont fixées ici. Elles se trouvent être aussi des noms
                # de propriété (§ 1.2) : la cohérence est heureuse, il ne faut pas la
                # « franciser ».
                username_path: email
                password_path: password
                success_handler: App\Module\Core\Security\AuthenticationSuccessHandler
                failure_handler: App\Module\Core\Security\AuthenticationFailureHandler

            # Connexion par CLÉ D'ACCÈS (passkey, WebAuthn) — `POST /api/connexion/cle-d-acces`,
            # § 2.6 du contrat. Un authentificateur du pare-feu, à côté de `json_login`, pour
            # hériter de tout ce qui suit sans le redire : le limiteur ci-dessous (les essais
            # par clé et par mot de passe d'un même compte se cumulent), le `user_checker`
            # (compte suspendu), la migration de session et le journal d'audit. Ses réponses
            # sont celles des gestionnaires de `json_login`, au caractère près.
            custom_authenticators:
                - App\Module\Core\Security\CleDAccesAuthenticator
                - App\Module\Core\Security\GoogleAuthenticator

            # Anti-force brute : 5 tentatives par couple identifiant+IP sur 15 minutes,
            # compteur remis à zéro à chaque connexion réussie. Symfony double la mesure
            # d'un limiteur par IP seule, à 5 × le plafond, qui attrape le balayage sur
            # plusieurs adresses. Le dépassement passe par le `failure_handler` ci-dessus
            # et ressort en `429 trop_de_tentatives` avec `Retry-After` (§ 1.9).
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'

            logout:
                path: core_deconnexion

    # Seule la *première* règle qui correspond est appliquée : l'ordre porte le sens.
    access_control:
        # Les seuls chemins sans session. `^/api/inscription` est public parce qu'on n'a
        # pas encore de compte quand on s'y présente ; sa protection est le jeton, et son
        # refus est un `404` (§ 4).
        - { path: ^/api/connexion, roles: PUBLIC_ACCESS }
        - { path: ^/api/inscription, roles: PUBLIC_ACCESS }
        # Le clic sur le lien de changement de courriel (§ 2.5). Public pour la même
        # raison que l'inscription : on clique depuis le courriel, souvent sur un autre
        # appareil, sans session. Sa protection est le jeton, et son refus un `404`.
        - { path: ^/api/session/courriel/confirmer, roles: PUBLIC_ACCESS }
        # Le lien personnel d'un invité à un événement : une personne sans compte y lit
        # l'annonce et répond présente ou absente. Public pour la même raison que
        # l'inscription ; sa protection est la clé, son refus un `404` unique, et un
        # limiteur par IP (`Evenement\Service\LimiteurDesLiens`). Le `/` final compte : il
        # n'ouvre rien d'autre sous `/api/evenements`.
        - { path: ^/api/evenements/lien/, roles: PUBLIC_ACCESS }
        # Le site du tirage de Noël : l'inscription publique, et la présentation d'un
        # tirage à qui ouvre son lien sans être connecté. Le code est exigé (`+`, ancré) :
        # `GET /api/noel/tirages` sans code — la liste de tous les tirages, réservée aux
        # membres d'heritage — tombe dans le filet `^/api` plus bas, et rend `401` sans session.
        - { path: ^/api/noel/inscription$, roles: PUBLIC_ACCESS }
        - { path: ^/api/noel/tirages/[A-Za-z0-9]+$, methods: [GET], roles: PUBLIC_ACCESS }
        # La sonde de disponibilité (`Core\Controller\SanteController`), pour une sonde
        # extérieure qui n'a pas de compte. Elle ne rend que `{"statut":"ok"}` ou un `503`
        # sans détail. Ancrée des deux côtés : elle n'ouvre rien d'autre que ce chemin.
        - { path: ^/api/sante$, roles: PUBLIC_ACCESS }
        # Avant `^/api`, faute de quoi cette règle ne serait jamais atteinte. Le journal
        # d'audit, les réglages, la bascule « voir comme un membre » et la gestion des
        # comptes vivent tous derrière.
        - { path: ^/api/administration, roles: ROLE_ADMIN }
        # Le filet : toute route `/api` non nommée ci-dessus exige une session — ou un jeton
        # d'API, qui passe par ces mêmes règles (ADR 0021).
        - { path: ^/api, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # Le hachage est coûteux par construction ; en test on abaisse le coût.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
