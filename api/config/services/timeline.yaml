# Contrat : ce fichier est celui du module Timeline (vue chronologique).
# Aucun autre module n'y écrit — c'est la règle qui évite les conflits de fusion.
#
# L'autowiring déclaré dans config/services/_autoload.yaml couvre déjà toutes les classes
# de src/Module/Timeline/. On ne déclare ici que ce que le conteneur ne peut pas
# deviner : **alias d'interface**.
#
# ─────────────────────────────────────────────────────────────────────────────────
# PIÈGE D'ORDRE DE CHARGEMENT — à connaître avant d'ajouter une ligne ici.
#
# `config/services.yaml` importe `services/*.yaml`, et Symfony traite TOUJOURS les
# imports avant les définitions du fichier qui les porte. Le prototype `App\:` vit dans
# `services/_autoload.yaml`, dont le préfixe « _ » le place en tête du glob : les
# fichiers de module l'emportent donc sur lui. Mais `FileLoader::registerClasses()`
# appelle `setDefinition()` sans condition, ce qui veut dire qu'une définition de
# service **concret** posée ici serait écrasée en silence si l'ordre changeait.
#
# Ce module n'y est pas exposé : il ne déclare que des alias d'interface, que le
# prototype ne touche pas. Tout ce qui relèverait d'un service concret se pose en
# **attribut**, dans la classe. Et l'on vérifie ce qu'on obtient réellement :
#
#     bin/console debug:container App\\Module\\Timeline\\Contract\\PortChronologieArbre
#
# Un `#[AsAlias]` ne conviendrait pas : il est traité par le prototype de
# `_autoload.yaml`, donc AVANT ce fichier, donc écrasé. C'est le même arbitrage que
# `config/services/membership.yaml` a déjà tranché pour le cercle de visibilité.
# ─────────────────────────────────────────────────────────────────────────────────

services:
    # ── Le port vers `Tree` ────────────────────────────────────────────────────────
    #
    # COUTURE À BRANCHER PAR L'AGENT `Tree`.
    #
    # `ArbreNonBranche` rend un arbre **vide** : la chronologie répond 200 avec ses
    # bandes et ses préférences, mais aucune barre et aucun jalon. C'est volontaire —
    # un module dont la dépendance de sécurité n'est pas câblée doit échouer fermé,
    # jamais permissif. Un arbre partiel rendu sans cercle serait exactement la fuite
    # qu'on ferme ici.
    #
    # Le contrat à respecter est écrit en entier sur l'interface. Tout existe déjà côté
    # `Tree` : `PersonRepository` pour les 274 personnes, `ReglePersonneVivante` (avec
    # `ReglagesDeLArbre::seuilVivantAnnees()`) pour la carte des vivants, `FactRepository`
    # pour les faits datés. L'adaptateur est une traduction, pas un calcul.
    #
    # La règle qu'il n'a pas le droit d'assouplir : `vue()` rend l'arbre COMPLET, sans
    # filtre de confidentialité. Le filtrage a lieu une seule fois, dans
    # `Timeline\Service\NormaliseurDeChronologie`.
    App\Module\Timeline\Contract\PortChronologieArbre:
        alias: App\Module\Tree\Service\VueDeLArbrePourChronologie

when@test:
    services:
        # Le port vers `Tree`, joué par un arbre en mémoire que chaque test peuple en
        # quelques lignes. C'est ce qui rend écrivables les tests du § 9.1 — le cas
        # Sureau, les bandes, le cercle — **sans base de l'arbre** : `tests/Timeline/`
        # ne charge aucune table `tree_*` et n'a pas à savoir qu'elles existent.
        #
        # Ce double ne remplace pas la vérification sur la vraie base : `Tree` a son
        # propre test d'adaptateur (`tests/Tree/AdaptateursPourLesAutresModulesTest.php`),
        # qui est l'endroit où l'on prouve que la traduction lit bien les 274 lignes.
        App\Tests\Timeline\Double\ArbreDeChronologieEnMemoire:
            public: true

        App\Module\Timeline\Contract\PortChronologieArbre:
            alias: App\Tests\Timeline\Double\ArbreDeChronologieEnMemoire
            public: true

        # ⚠ NE PAS AJOUTER ICI DE SERVICE DE `src/` POUR LE RENDRE PUBLIC.
        #
        # `_defaults` n'est **pas hérité d'un fichier à l'autre**. Une ligne
        #
        #     App\Module\Timeline\Service\NormaliseurDeChronologie: { public: true }
        #
        # ne rend pas le service public : elle le **redéfinit**, sans `autowire`, et
        # écrase la définition autowirée du prototype `App\:` — qui est chargé AVANT ce
        # fichier. Le conteneur se compile, `lint:container` reste vert, et l'on obtient
        # au premier appel un `ArgumentCountError: 0 passed, exactly 4 expected`.
        # Vérifié ici même, en écrivant ce module : deux lignes de confort, vingt-cinq
        # tests rouges.
        #
        # Les services de ce module se testent par leurs routes ou en les instanciant
        # directement — ils n'ont aucune dépendance que le conteneur seul sache fournir.
        # S'il en fallait vraiment un public un jour, il faudrait rouvrir un bloc
        # `_defaults: { autowire: true, autoconfigure: true }` ici.
