# Contrat : ce fichier est celui du module Evenement (événements de famille — « Cousinade
# été 2027 »). Aucun autre module n'y écrit — c'est la règle qui évite les conflits de fusion.
#
# L'autowiring de config/services/_autoload.yaml couvre toutes les classes du module. On
# ne déclare ici que l'alias d'interface — lire l'en-tête de `timeline.yaml` sur le piège
# d'ordre de chargement avant d'y ajouter un service concret.

services:
    # ── Le port vers `Tree` ────────────────────────────────────────────────────────
    #
    # Des noms et l'état « vivante », rien de plus — comme le port des tirages, moins les
    # couples. Pas de double en `when@test` : les tests du module sèment un vrai arbre
    # (`tests/Tree/ArbreWebTestCase`) et éprouvent donc l'adaptateur réel.
    App\Module\Evenement\Contract\PortArbrePourEvenements:
        alias: App\Module\Tree\Service\VueDeLArbrePourEvenements
