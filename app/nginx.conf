# Front de « Heritage » servi par nginx, en production.
#
# Ce fichier est la pièce qui donne au projet son ORIGINE UNIQUE : la SPA et
# l'API sont servies par le même hôte, le même port, le même schéma. C'est ce qui
# permet de ne configurer aucun CORS côté Symfony et de garder le cookie de
# session HttpOnly + SameSite=Lax sans exception. Si un jour l'API est déplacée
# sur un autre domaine, ce n'est pas ce fichier qu'il faut ajuster : c'est toute
# la politique de sécurité du projet qu'il faut rouvrir.
#
# =============================================================================
#  CE FICHIER EST UN GABARIT — le domaine public y est une VARIABLE
# =============================================================================
#
# Il porte un seul emplacement à substituer — HERITAGE_DOMAINE_PUBLIC, sur la
# ligne `server_name` du bloc applicatif. Tout le reste est du nginx littéral.
#
# POURQUOI. Ce fichier était figé dans l'image par un `COPY` et ne nommait que
# `localhost` et `127.0.0.1`. Le premier bloc déclaré étant un `return 444`, une
# requête portant le domaine réel ne tombait dans aucun `server_name`, atterrissait
# dans l'attrape-tout et la connexion se fermait SANS RÉPONSE. Panne totale, muette,
# et invisible en développement — où le domaine est justement `localhost`. La
# correction « éditer la ligne avant de construire l'image » marche une fois et se
# perd au premier `git reset --hard` d'un déploiement : le domaine devait cesser
# d'être une donnée du dépôt pour devenir une donnée de la machine.
#
# COMMENT, ET PAR QUI. L'image `nginx` officielle embarque
# `/docker-entrypoint.d/20-envsubst-on-templates.sh`, qui passe `envsubst` sur tout
# fichier de `/etc/nginx/templates/*.template` et dépose le résultat dans
# `/etc/nginx/conf.d/`. C'est `compose.prod.yaml` qui met ce mécanisme en marche,
# en montant CE fichier à cet emplacement :
#
#     volumes:
#       - ./app/nginx.conf:/etc/nginx/templates/default.conf.template:ro
#     environment:
#       HERITAGE_DOMAINE_PUBLIC: ${HERITAGE_DOMAINE_PUBLIC:-}
#       NGINX_ENVSUBST_FILTER: "^HERITAGE_"
#
# La sortie s'appelle `default.conf` et ÉCRASE la copie figée par le `COPY` du
# Dockerfile. Conséquence secondaire, vérifiée et sans effet ici : le script
# `10-listen-on-ipv6-by-default.sh`, qui s'exécute AVANT celui-ci, ajoute un
# `listen [::]:80` à la copie figée — que la substitution efface aussitôt. Le
# conteneur n'écoute donc qu'en IPv4, ce qui est exactement ce dont il a besoin :
# son unique client est le nginx de l'hôte, qui le joint par la boucle locale.
#
# Les deux chemins coexistent sans se contredire :
#   - développement (compose.yaml seul) : pas de montage, pas de substitution, la
#     copie figée sert telle quelle et `${HERITAGE_DOMAINE_PUBLIC}` reste un nom
#     d'hôte littéral que personne ne compose jamais — inoffensif ;
#   - production (compose.prod.yaml) : le gabarit est substitué au démarrage, le
#     domaine réel entre dans `server_name`, et il vient du `.env` de la machine.
#
# `NGINX_ENVSUBST_FILTER: "^HERITAGE_"` N'EST PAS FACULTATIF. Voici ce qu'il ferme,
# mesuré et non supposé — la nuance compte, parce que le défaut ne se voit pas.
#
# Sans filtre, le script d'entrée construit la liste des noms à substituer À PARTIR
# DE L'ENVIRONNEMENT DU CONTENEUR, tout entier. Les variables de nginx — `$uri`,
# `$host`, `$scheme`, `$http_host`, `$remote_addr`, `$cache_actifs` — y survivent
# donc AUJOURD'HUI, non par construction, mais parce qu'aucune variable
# d'environnement ne porte ces noms-là : les unes sont en minuscules, les autres en
# majuscules par usage. C'est une coïncidence, pas une garantie, et rien ne la
# protège : il suffit qu'un jour une variable nommée `uri`, `host` ou `scheme`
# entre dans l'environnement — par un `environment:` de compose, par une image de
# base, par un outil — pour que la configuration soit réécrite en silence.
#
# Vérifié le 16 septembre 2026, conteneur `nginx:1.27-alpine`, en ajoutant
# `-e uri=CASSE -e scheme=CASSE` : sans filtre, le repli SPA devient
# `try_files CASSE CASSE/ /index.html;` et la `map` du schéma `default CASSE;`.
# La configuration passe `nginx -t` — elle est syntaxiquement valable et
# fonctionnellement morte. Avec le filtre, les deux lignes sont intactes.
#
# Le filtre restreint la substitution aux noms commençant par `HERITAGE_`,
# c'est-à-dire à la seule variable que ce fichier déclare vouloir. Il transforme
# une coïncidence en règle.
#
# LE JOUR OÙ app/Dockerfile SERA MODIFIÉ — une ligne suffit :
#     COPY nginx.conf /etc/nginx/templates/default.conf.template
# à la place du `COPY nginx.conf /etc/nginx/conf.d/default.conf` actuel. Le montage
# de compose.prod.yaml devient alors inutile et peut disparaître. Tant que cette
# ligne n'est pas posée, le montage est ce qui tient le mécanisme : ne le retirez
# pas « pour faire propre » sans avoir posé l'autre. (app/Dockerfile appartient à un
# autre lot ; c'est pour cela que le montage existe.)
# =============================================================================

# ---------------------------------------------------------------------------
# Contexte `http` : les `map` ne peuvent pas vivre dans un bloc `server`.
# ---------------------------------------------------------------------------

# Schéma vu par le NAVIGATEUR, pas par nous.
# `$scheme` vaut toujours `http` ici : nginx écoute en clair sur le port 80 du
# conteneur, même quand le site est servi en https par un proxy en amont. Écraser
# X-Forwarded-Proto avec `$scheme` ferait donc fabriquer des liens `http://` à
# l'API sur un VPS en TLS. On conserve la valeur du proxy en amont quand il y en
# a un, et on retombe sur la nôtre quand il n'y en a pas.
map $http_x_forwarded_proto $schema_client {
    default      $scheme;
    "~^https?$"  $http_x_forwarded_proto;
}

# Port composé par le NAVIGATEUR.
# `$server_port` vaut 80 — le port INTERNE du conteneur — et ne coïncide avec le
# port public que par accident. En local, compose publie 8080 ; en production, le
# proxy en amont écoute en 443. Dans les deux cas, 80 est faux.
# Chaîne vide = en-tête non émis (comportement documenté de `proxy_set_header`) :
# c'est voulu. Sans X-Forwarded-Port, Symfony déduit le port de l'en-tête Host,
# que l'on transmet intact ci-dessous — ce qui est exactement ce qu'il faut. On
# ne réécrit donc que si un proxy en amont a déjà tranché.
map $http_x_forwarded_port $port_client {
    default    "";
    "~^\d+$"   $http_x_forwarded_port;
}

# Durée de cache, déduite du chemin.
# Passer par une `map` plutôt que par un `location /assets/` distinct n'est pas
# une coquetterie : un `add_header` dans un second `location` rejouerait le piège
# décrit plus bas. Un seul bloc pose les en-têtes, donc un seul endroit à lire.
# `$uri` est évalué APRÈS le repli `try_files`, donc une route profonde retombée
# sur /index.html reçoit bien `no-cache` et non le cache long : c'est ce qui
# permet à un déploiement d'être vu par les navigateurs déjà ouverts.
map $uri $cache_actifs {
    default        "no-cache";
    "~^/assets/"   "public, max-age=31536000, immutable";
}

# ---------------------------------------------------------------------------
# LE BLOC PAR DÉFAUT — il attrape tout ce que le bloc applicatif ne nomme pas,
# et il ferme la connexion sans répondre.
#
# Sans lui, un `Host` inconnu ne tombe nulle part : nginx choisit alors le
# premier bloc déclaré pour ce port, c'est-à-dire le nôtre. Une requête portant
# `Host: evil.attaquant.test` était donc servie exactement comme une requête
# légitime — coque SPA, actifs, et relais `/api` compris.
#
# `444` n'est pas un code HTTP : c'est la convention interne de nginx pour
# « ferme la connexion sans rien envoyer ». Rien ne part, pas même un en-tête,
# donc rien ne confirme à qui sonde que quelque chose écoute ici.
#
# ATTENTION, ET C'EST LE PIÈGE DE CE FICHIER — `server_name _` NE VEUT PAS DIRE
# « n'importe quel hôte ». `_` est un nom volontairement invalide, qui ne
# correspond à RIEN ; ce qui fait de ce bloc l'attrape-tout, c'est le mot
# `default_server` sur la ligne `listen`, pas le `_`. Conséquence directe : le
# bloc applicatif plus bas ne peut plus garder `server_name _`, sinon il ne
# serait plus jamais choisi et TOUTES les requêtes finiraient ici, en `444`.
# C'est pour ça que les deux changements vont ensemble et jamais l'un sans
# l'autre — un `default_server` ajouté seul met le front entier par terre.
#
# Déclaré EN PREMIER, et pas seulement marqué `default_server` : le repli de
# nginx en l'absence de `default_server` est le premier bloc du port. Les deux
# mécanismes désignent donc le même bloc, et retirer par mégarde le mot-clé ne
# rouvre pas le trou.
server {
    listen 80 default_server;
    server_name _;

    server_tokens off;
    return 444;
}

server {
    listen 80;

    # NOMMÉ, et non plus `_`. Voir le bloc au-dessus : c'est ce qui décide quelles
    # requêtes sont servies et lesquelles sont fermées.
    #
    #   localhost / 127.0.0.1 / [::1]  le développement local — compose publie
    #   le front sur `127.0.0.1:8080`. nginx compare `$host`, c'est-à-dire l'hôte
    #   SANS le port : `localhost:8080` correspond bien à `localhost`.
    #
    # `${HERITAGE_DOMAINE_PUBLIC}` EST LE DOMAINE RÉEL, ET IL N'EST PAS DANS CE
    # FICHIER : il est substitué au démarrage du conteneur depuis le `.env` de la
    # machine. Voir le pavé « CE FICHIER EST UN GABARIT » en tête de fichier.
    #
    # Ce qui se passe si la substitution n'a pas lieu, ou si la variable est vide :
    # la ligne se réduit aux trois noms locaux, le proxy amont transmet le domaine
    # réel, aucun bloc ne le nomme, et TOUT part en `444` — connexion fermée sans
    # réponse. Panne immédiate et totale. C'est bruyant et c'est voulu : une liste
    # blanche d'hôtes qui échoue en silence est celle qu'on découvre six mois plus
    # tard en lisant un journal. Le `garde-secrets` de compose.prod.yaml refuse pour
    # cette raison de laisser démarrer une pile où `HERITAGE_DOMAINE_PUBLIC` est
    # vide, et exige qu'elle coïncide avec le domaine de `HERITAGE_URL_PUBLIQUE`.
    #
    # Les trois noms locaux RESTENT, y compris en production, et ce n'est pas un
    # oubli : c'est par eux que passe la mesure de contrôle d'après déploiement,
    # `curl -H 'Host: …' http://127.0.0.1:5511/` depuis le VPS, et la sonde de
    # `depends_on` du réseau interne. Ils ne sont joignables que depuis la machine,
    # le port n'étant publié que sur la boucle locale.
    server_name localhost 127.0.0.1 "~^\[::1\]$" ${HERITAGE_DOMAINE_PUBLIC};

    root /usr/share/nginx/html;
    index index.html;

    # On n'annonce pas la version de nginx dans les réponses.
    server_tokens off;

    # Compression des actifs. Déclarée ici, dans le `server`, et non au niveau
    # `http` : le nginx.conf principal de l'image déclare déjà `gzip`, et une
    # seconde déclaration dans le même contexte ferait échouer le démarrage.
    # Le SVG de l'arbre (377 nœuds, plusieurs centaines de kilo-octets de
    # balisage) est le premier bénéficiaire.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml
        font/woff2
        application/manifest+json;

    # =====================================================================
    # QUI POSE LES EN-TÊTES DE SÉCURITÉ — à lire avant d'en ajouter un
    #
    # Règle : chaque serveur est responsable des réponses QU'IL PRODUIT.
    #   - nginx  → la coque SPA et les actifs statiques (bloc `location /`) ;
    #   - l'API  → ses propres réponses JSON, via son SecurityHeadersSubscriber.
    # nginx ne re-tamponne JAMAIS une réponse relayée. C'est pour cela que les
    # `add_header` ne sont pas ici, au niveau `server`, où ils s'appliqueraient
    # aussi à /api.
    #
    # Ce qui a motivé la règle, car ce n'était pas théorique : posés au niveau
    # `server`, Referrer-Policy et Permissions-Policy partaient en DOUBLE sur les
    # réponses d'/api, une fois par l'API et une fois par nous. Et c'est la nôtre,
    # la plus permissive, qui gagnait :
    #   - Referrer-Policy est une liste de jetons dont le DERNIER valide gagne ;
    #     le nôtre, ajouté après celui du relais, écrasait le `no-referrer` de
    #     l'API par `strict-origin-when-cross-origin`.
    #   - Permissions-Policy est un dictionnaire où une clé répétée écrase la
    #     précédente ; notre valeur, plus courte, rouvrait `payment` et `usb` que
    #     l'API fermait.
    # À l'inverse, deux Content-Security-Policy ne se seraient pas écrasées : la
    # spécification les fait toutes s'appliquer, donc leur INTERSECTION. C'est
    # précisément pourquoi le défaut ne se voyait que sur ces deux en-têtes-là,
    # et pas sur la CSP ni sur X-Content-Type-Options, identique des deux côtés.
    # Ne comptez pas sur cette clémence : un en-tête en double est un bug, même
    # quand il se résout en votre faveur.
    #
    # ATTENTION, piège nginx, toujours valable : un `add_header` dans un bloc
    # `location` REMPLACE tout le jeu hérité du bloc parent au lieu de s'y
    # ajouter. C'est ce qui rend la règle ci-dessus tenable — `location /api`
    # n'ayant aucun `add_header`, il n'hérite de rien et l'API reste maîtresse
    # chez elle — mais c'est aussi le piège à connaître si vous ajoutez un
    # troisième bloc : il repartira sans aucun en-tête de sécurité.
    # =====================================================================

    # ---------------------------------------------------------------------
    # Content-Security-Policy — stricte et entièrement same-origin.
    #
    # Chaque source est restreinte pour une raison. Si vous devez en élargir
    # une, lisez d'abord pourquoi elle est fermée ; ce qui suit est la liste de
    # ce que vous casseriez.
    #
    #   default-src 'self'
    #       Tout ce qui n'est pas listé plus bas ne peut venir que de nous.
    #       C'est le filet : une directive oubliée retombe ici, pas sur « tout
    #       est permis ».
    #
    #   script-src 'self'
    #       Aucun script distant, aucun 'unsafe-inline', aucun 'unsafe-eval'.
    #       Les bundles Vite sont des modules externes empreintés, ils n'ont
    #       besoin de rien d'autre. Conséquence pratique : pas de balise
    #       d'analytique, pas de widget tiers, pas de script en ligne dans
    #       index.html. Ajouter 'unsafe-inline' ici rendrait exploitable la
    #       moindre injection dans un nom de personne saisi par un membre.
    #
    #   style-src 'self' 'unsafe-inline'
    #       Seule concession, et elle est côté styles uniquement : Vue pose des
    #       attributs `style` en ligne pour ses liaisons `:style`, et le canevas
    #       de l'arbre en pose sur les nœuds. Un style en ligne ne permet pas
    #       d'exécuter de code ; le risque n'est pas comparable à celui d'un
    #       script en ligne. Retirer 'unsafe-inline' ici casserait le viewer.
    #
    #   img-src 'self' data: blob: https://tile.openstreetmap.org
    #       'self'  : portraits et preuves, servis par une route authentifiée de
    #                 l'API qui applique le cercle de visibilité (§ 6.5).
    #       data:   : petites icônes SVG embarquées dans le CSS.
    #       blob:   : prévisualisation d'un fichier AVANT téléversement
    #                 (URL.createObjectURL). Sans blob:, l'écran de dépôt d'un
    #                 acte n'affiche rien tant que le serveur n'a pas répondu.
    #
    #       tile.openstreetmap.org : **le seul hôte distant de tout le produit**,
    #       et la seule exception à la règle « aucun tiers ». Elle mérite d'être
    #       lue en entier avant d'être étendue à quoi que ce soit d'autre.
    #
    #       Ce qui la rendait inacceptable partout ailleurs : « une image chargée
    #       depuis un tiers révèle à ce tiers qui consulte quelle fiche, et à
    #       quelle heure ». C'est vrai d'un portrait, d'une preuve, d'un acte —
    #       l'URL nomme alors la personne regardée.
    #
    #       Ce n'est pas vrai d'une tuile. Son URL est un `{z}/{x}/{y}` : une
    #       zone du globe et un niveau de zoom. Le serveur de tuiles apprend
    #       qu'une adresse IP a regardé une région ; il n'apprend ni un nom, ni
    #       une date, ni une fiche, ni même qu'il s'agit d'un arbre familial.
    #       C'est cette différence-là, et elle seule, qui rend l'exception
    #       tenable — pas le fait qu'elle soit pratique.
    #
    #       Et la carte ne s'en sert pas par défaut. Son fond est un GeoJSON
    #       servi par nous ; les tuiles n'arrivent qu'après un appui sur « fond
    #       détaillé », dans une barre d'outils qui dit d'abord ce que l'appui
    #       coûte. Élargir l'en-tête et se servir de l'élargissement sont deux
    #       choses distinctes : tant que personne n'appuie, rien ne part.
    #
    #       `connect-src` n'est PAS élargi, et n'a pas à l'être : Leaflet charge
    #       ses tuiles par <img>, pas par fetch. Leaflet lui-même, sa feuille de
    #       style et ses images sont empaquetés par Vite, donc same-origin.
    #
    #   font-src 'self'
    #       Les polices sont auto-hébergées via @fontsource et empaquetées par
    #       Vite. C'est la contrainte à connaître avant de changer de police :
    #       un <link> vers Google Fonts (ou n'importe quel CDN) ne chargera pas,
    #       et le navigateur retombera silencieusement sur la police système —
    #       aucune erreur visible, juste un rendu différent. On change de police
    #       en ajoutant un paquet @fontsource, jamais une URL.
    #
    #   connect-src 'self'
    #       L'API est sur la même origine, cf. le `location /api` plus bas.
    #       Rien d'autre à joindre : ni télémétrie, ni service externe.
    #
    #   object-src 'none'
    #       Pas de <object>/<embed> : plus de greffon, plus de surface.
    #
    #   frame-src 'self'
    #       Les preuves peuvent être des PDF, affichés dans une <iframe> servie
    #       par notre propre route de médias. Aucun cadre distant.
    #
    #   frame-ancestors 'none'
    #       Personne ne nous encadre : pas de détournement de clic sur les
    #       boutons « valider » / « refuser » de l'administration.
    #
    #   base-uri 'self' / form-action 'self'
    #       Une injection ne peut ni réécrire la base des URLs relatives ni
    #       rediriger la soumission d'un formulaire (donc un mot de passe) vers
    #       un hôte tiers.
    # ---------------------------------------------------------------------
    #
    # Tout ce qui précède s'applique dans le SEUL bloc ci-dessous, celui qui sert
    # nos propres fichiers. Le repli SPA y est aussi : le routeur est en mode
    # historique (createWebHistory), donc /arbre/42 ou /invitation/xxx n'existent
    # pas sur le disque. Sans ce repli, un rechargement ou un lien collé sur une
    # route profonde rendrait 404 — et le lien d'invitation, qui est justement une
    # route profonde ouverte dans un navigateur vierge, ne marcherait jamais.
    location / {
        try_files $uri $uri/ /index.html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        # Aucun écran n'a besoin de la position ni du micro. On les coupe à la
        # racine : le projet manipule déjà des photos de famille dont on purge
        # les coordonnées GPS (§ 6.5), autant ne pas en réintroduire par le
        # navigateur.
        #
        # La CAMÉRA est ouverte à cette origine seule (`self`), et à rien
        # d'autre : « Ma photo » propose de prendre son portrait
        # (`ChoixPortrait.vue`, `getUserMedia`). `camera=()` la refusait avant
        # même de poser la question au lecteur — « la caméra n'est pas
        # accessible » sur tous les téléphones. Le navigateur demande toujours
        # l'autorisation ; ceci ne fait que lui permettre de la demander.
        # Le MICRO aussi, à ce seul site : la dictée de l'assistant (« Dicter »,
        # `DicteeVocale.vue`). Même raisonnement que la caméra : le navigateur
        # demande toujours l'autorisation, ceci lui permet seulement de la demander.
        add_header Permissions-Policy "geolocation=(), camera=(self), microphone=(self)" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org; font-src 'self'; connect-src 'self'; object-src 'none'; frame-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

        # Cache long sur les actifs empreintés par Vite, `no-cache` sur le reste
        # — index.html en premier, sinon un déploiement resterait invisible pour
        # les navigateurs déjà ouverts. Le tri se fait par la `map` en tête de
        # fichier, et non par un `location /assets/` séparé : un second bloc
        # aurait eu besoin qu'on lui recopie les sept en-têtes ci-dessus, et la
        # première recopie oubliée est la CSP.
        add_header Cache-Control $cache_actifs always;
    }

    # ---------------------------------------------------------------------
    # SONDE DE DÉPLOIEMENT — `/sante.php`, relayée telle quelle vers l'API.
    #
    # `api/public/sante.php` est servi par FrankenPHP SANS amorcer le noyau
    # Symfony, et rend `{"etat","empreinte","construite_le"}`. L'`empreinte` est
    # le sha256 tronqué des sources de l'API, gravé dans l'image à la
    # construction par `api/docker/empreinte.sh`.
    #
    # POURQUOI L'EXPOSER ICI, ALORS QUE LE `HEALTHCHECK` DU CONTENEUR LA LIT DÉJÀ.
    # Parce que ce ne sont pas les mêmes questions. La sonde du Dockerfile demande
    # « ce conteneur est-il vivant ? » depuis l'intérieur. Celle-ci demande, depuis
    # DEHORS et à travers toute la chaîne (TLS de l'hôte → nginx du front → API) :
    # « le code servi est-il celui du commit que je viens de déployer ? » Le flux
    # de déploiement compare la valeur rendue ici à `sh api/docker/empreinte.sh`
    # exécuté sur l'arbre du commit déployé. Deux valeurs différentes = l'image
    # est périmée, le déploiement n'a pas eu lieu, on revient en arrière.
    #
    # C'est le seul contrôle qui distingue « déployé » de « cru déployé » : la pile
    # locale a servi pendant des heures du code vieux d'une journée sans que rien
    # ne le signale. Une sonde qui ne dit que « je réponds » n'aurait rien vu.
    #
    # CE QU'ELLE DIVULGUE, ET POURQUOI C'EST ACCEPTABLE : un condensé de 12
    # caractères et une date UTC. Ni version, ni chemin, ni environnement, ni
    # dépendance. Le fichier n'ouvre pas la base et ne lit aucune entité. Une sonde
    # accessible seulement depuis l'intérieur ne prouverait rien sur la chaîne
    # publique, qui est précisément ce qu'on veut prouver.
    #
    # `location = …` : correspondance EXACTE. `/sante.php?x=1` passe (la chaîne de
    # requête ne fait pas partie de `$uri`), `/sante.phpx` et `/a/sante.php` non.
    # Aucun autre `.php` n'est relayé : le front ne sert pas de PHP, et le bloc
    # `location /` ne fait que du `try_files` vers des fichiers statiques.
    #
    # Aucun `add_header` ici, donc aucun en-tête de sécurité hérité (piège nginx
    # documenté plus haut). C'est sans conséquence : la réponse est du JSON `no-store`
    # de 80 octets, jamais rendue dans un document.
    # ---------------------------------------------------------------------
    location = /sante.php {
        proxy_pass http://api:8000/sante.php;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $schema_client;

        # Court volontairement : cette sonde ne doit jamais faire patienter le
        # flux de déploiement. Une API qui met plus de cinq secondes à rendre un
        # fichier statique PHP est une API en panne, et c'est la réponse utile.
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    # ---------------------------------------------------------------------
    # API : même origine, relayée vers le conteneur Symfony.
    #
    # `api` est le nom du service dans compose et `8000` le port sur lequel il
    # écoute ; les deux doivent correspondre à ce que déclare le compose.yaml de
    # la racine. Pas de barre finale après le port : l'URI est transmise telle
    # quelle, préfixe /api compris, qui est celui des routes Symfony.
    # ---------------------------------------------------------------------
    location /api {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;

        # `$http_host` et NON `$host` : les deux se ressemblent, mais `$host`
        # retire le port. Avec lui, l'API recevait `Host: 127.0.0.1` alors que le
        # navigateur avait composé `127.0.0.1:8080`, et fabriquait des liens
        # d'invitation sans port — donc des liens morts. L'invitation étant le
        # seul moyen d'entrer dans l'application (§ 6.1), c'est la fonctionnalité
        # entière qui tombait. `$http_host` transmet l'en-tête Host tel quel.
        proxy_set_header Host $http_host;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Schéma et port : voir les `map` en tête de fichier. On ne pose PAS
        # `$scheme`/`$server_port`, qui décrivent notre écoute interne et non ce
        # que le navigateur a composé.
        proxy_set_header X-Forwarded-Proto $schema_client;
        proxy_set_header X-Forwarded-Port $port_client;

        # AVERTISSEMENT, à lire avant de déployer sur un VPS.
        # Host et X-Forwarded-* viennent du client. L'API leur fait confiance
        # (`trusted_proxies: private_ranges` dans api/config/packages/framework.yaml)
        # parce que nous sommes dans une plage privée — elle ne peut donc pas
        # distinguer ce que nous avons calculé de ce qu'un client a soufflé.
        # Comme les liens d'invitation sont construits à partir de ces valeurs et
        # partent par courriel, un Host falsifié produit un lien d'hameçonnage
        # signé par nous. TROIS garde-fous, dont un seul est dans ce fichier :
        #   - `framework.trusted_hosts` côté API, qui rejette tout Host inattendu.
        #     POSÉ : le repli de `app.hotes_autorises_defaut` n'est plus `.*` mais
        #     la liste blanche du développement local, et compose.prod.yaml exige
        #     `HERITAGE_HOTES_AUTORISES` pour démarrer en production ;
        #   - le `server_name` du bloc applicatif plus haut, doublé du bloc par
        #     défaut en `444`, qui ferme la connexion avant même le relais. POSÉ ;
        #   - le proxy en amont, en production, qui doit ÉCRASER (et non compléter)
        #     X-Forwarded-Proto et X-Forwarded-Port à l'entrée. À LA CHARGE DE
        #     L'EXPLOITANT — voir compose.prod.yaml, point 3.
        #
        # Les deux premiers sont indépendants et se doublent : nginx ferme sur le
        # `Host`, et l'API refuse même si la requête lui arrive par un autre
        # chemin — le port 8000 est publié sur la boucle locale en développement,
        # elle est donc joignable sans passer par ici.

        # Les preuves sont des photos d'actes prises au téléphone : 1 Mo (le
        # défaut de nginx) fait échouer le téléversement avec un 413 que
        # personne ne sait interpréter. La borne réelle reste celle appliquée
        # par l'API, qui seule peut refuser proprement.
        client_max_body_size 25m;
        proxy_request_buffering off;
    }

}
