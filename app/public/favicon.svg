<!-- Favicon de Heritage : un arbre à trois nœuds, aux couleurs de la charte.
     Un SVG servi en favicon peut porter sa propre feuille de style, et Chrome
     honore `prefers-color-scheme` dedans : l'icône suit donc le thème du
     navigateur, comme le reste de l'interface. Les deux teintes sont celles de
     la variable d'accent d'`arbre.html` — brun en clair, sable en sombre.
     Pas de double tiret dans ce commentaire : XML l'interdit, et le fichier
     cesserait d'être une image (onglet et manifeste). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" stroke-width="2" stroke-linecap="round">
  <style>
    :root { --e: #8a5a2b }
    @media (prefers-color-scheme: dark) { :root { --e: #d9a066 } }
  </style>
  <g stroke="var(--e)">
    <path d="M16 28V13" />
    <path d="M7 13h18" />
    <path d="M7 13V9" />
    <path d="M25 13V9" />
  </g>
  <g fill="var(--e)">
    <circle cx="16" cy="6" r="3" />
    <circle cx="7" cy="7" r="2.5" />
    <circle cx="25" cy="7" r="2.5" />
  </g>
</svg>
